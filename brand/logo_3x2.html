<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1500px; height: 1000px; overflow: hidden; background: #05070B; }
  .stage { position: relative; width: 1500px; height: 1000px; display: flex; align-items: center; justify-content: center; gap: 64px;
    background:
      radial-gradient(circle at 34% 50%, rgba(94,234,212,.16), transparent 42%),
      linear-gradient(rgba(94,234,212,.05) 1px, transparent 1px) 0 0 / 50px 50px,
      linear-gradient(90deg, rgba(94,234,212,.05) 1px, transparent 1px) 0 0 / 50px 50px, #05070B; }
  .mark { width: 470px; }
  .word { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 190px; letter-spacing: -8px; color: #E6EDF5; line-height: .9; }
  .word b { color: #5EEAD4; font-weight: 700; }
  .tag { margin-top: 26px; font-family: 'JetBrains Mono', monospace; font-size: 25px; letter-spacing: 6px; color: #7D8DA1; }
</style></head>
<body><div class="stage">
  <img class="mark" src="mark.svg" alt="">
  <div><div class="word"><b>Re</b>Trace</div><div class="tag">FIND ANY CAR · ACROSS EVERY CAMERA</div></div>
</div></body></html>
